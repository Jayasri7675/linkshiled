<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LinkShield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">🛡️ <span>Link</span>Shield</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="scanner.html">Scanner</a>
        <a href="history.html">History</a>
        <a href="login.html" id="loginNav" class="login">Login</a>
        <button id="logoutNav" class="logout" onclick="logout()">Logout</button>
    </div>
</nav>

<section class="auth page active">
    <div class="auth-box">
        <h1>Create Account</h1>
        <p>Start protecting yourself.</p>

        <div class="form-group">
            <label>Name</label>
            <input id="registerName" type="text" placeholder="Your name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input id="registerEmail" type="email" placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="registerPassword" type="password" placeholder="Password">
        </div>

        <button class="btn primary" onclick="register()">Create Account</button>

        <p class="auth-bottom">
            Already have an account?
            <a href="login.html" class="auth-link">Sign in</a>
        </p>
    </div>
</section>

<footer>🛡️ LinkShield — Phishing URL Detection System</footer>

<script src="script.js"></script>
</body>
</html>
